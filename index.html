<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Assemble Your RO Purifier</title>
<style>
  @font-face {
    font-family: 'system-display';
    src: local('Segoe UI Semibold'), local('Arial');
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #F7F7F5;
    color: #0F172A;
  }
  .display-font {
    font-family: -apple-system, 'Segoe UI Semibold', Roboto, Helvetica, Arial, sans-serif;
    letter-spacing: -0.01em;
  }
  .topbar {
    border-bottom: 1px solid #D8DCE1;
    background: #0F172A;
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 200;
  }
  .topbar-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .hamburger-btn {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 1px solid #2B3B4E;
    background: #16233A;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
  }
  .hamburger-btn:hover { background: #1D2E48; }
  .hamburger-btn span {
    display: block;
    width: 18px;
    height: 2px;
    background: #F7F7F5;
    border-radius: 1px;
  }
  .brand-mark {
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    color: #0F172A;
    background: #1D7A6E;
    border-radius: 6px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .topbar-title-wrap { min-width: 0; }
  h1 {
    font-weight: 600;
    font-size: 18px;
    color: #F7F7F5;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-sub {
    color: #9FB0C3;
    font-size: 12.5px;
    margin: 2px 0 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Nav drawer */
  .nav-scrim {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    z-index: 300;
  }
  .nav-scrim.visible { display: block; }
  .nav-drawer {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 280px;
    max-width: 82vw;
    background: #0F172A;
    z-index: 301;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    display: flex;
    flex-direction: column;
    box-shadow: 8px 0 30px rgba(0,0,0,0.25);
  }
  .nav-drawer.open { transform: translateX(0); }
  .nav-drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 18px 16px;
    border-bottom: 1px solid #22324A;
  }
  .nav-drawer-brand { display: flex; align-items: center; gap: 10px; }
  .nav-drawer-brand-text { color: #F7F7F5; font-weight: 600; font-size: 15px; }
  .nav-close-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: #16233A;
    color: #9FB0C3;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nav-close-btn:hover { background: #1D2E48; color: #F7F7F5; }
  .nav-links {
    list-style: none;
    margin: 0;
    padding: 10px 10px 20px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
  }
  .nav-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 12px;
    border-radius: 8px;
    color: #D7DEE6;
    font-size: 14.5px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    background: transparent;
    border: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
  }
  .nav-link:hover { background: #182338; color: #fff; }
  .nav-link.active { background: #16332E; color: #6FD6C2; }
  .nav-link-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nav-link-icon svg { width: 100%; height: 100%; }
  .nav-soon-tag {
    margin-left: auto;
    font-size: 10px;
    font-weight: 600;
    color: #8A96A3;
    background: #16233A;
    padding: 2px 7px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .nav-drawer-footer {
    padding: 14px 18px 18px;
    border-top: 1px solid #22324A;
    font-size: 11.5px;
    color: #6B7B90;
    line-height: 1.5;
  }
  .app-body {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 28px;
    padding: 28px 24px 80px;
  }
  @media (max-width: 860px) {
    .app-body { grid-template-columns: 1fr; }
    .summary-sticky { position: static !important; }
  }
  @media (max-width: 420px) {
    .address-form-row { grid-template-columns: 1fr; }
  }
  .my-builds-view {
    max-width: 800px;
    margin: 0 auto;
    padding: 28px 24px 80px;
  }
  .my-builds-header { margin-bottom: 20px; }
  .my-builds-title { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .my-builds-sub { font-size: 13.5px; color: #8A96A3; margin: 0; line-height: 1.5; }
  .my-builds-empty {
    background: #fff;
    border: 1px dashed #D8DCE1;
    border-radius: 10px;
    padding: 36px 24px;
    text-align: center;
    color: #8A96A3;
    font-size: 14px;
    line-height: 1.6;
  }
  .my-builds-empty a, .back-to-builder-btn {
    display: inline-block;
    margin-top: 12px;
    background: #1D7A6E;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 7px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .saved-build-card {
    background: #fff;
    border: 1px solid #D8DCE1;
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .saved-build-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
  }
  .saved-build-date { font-size: 12px; color: #8A96A3; margin: 0 0 4px; }
  .saved-build-progress { font-size: 14px; font-weight: 600; color: #0F172A; margin: 0; }
  .saved-build-total { font-size: 16px; font-weight: 700; color: #1D7A6E; white-space: nowrap; }
  .saved-build-parts {
    font-size: 12.5px;
    color: #3B5169;
    line-height: 1.6;
    margin: 0 0 14px;
  }
  .saved-build-actions { display: flex; gap: 10px; }
  .resume-btn {
    flex: 1;
    background: #1D7A6E;
    color: #fff;
    border: none;
    padding: 10px 14px;
    border-radius: 7px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .delete-build-btn {
    background: #fff;
    color: #C4501F;
    border: 1px solid #EBD3C0;
    padding: 10px 14px;
    border-radius: 7px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .delete-build-btn:hover { background: #FBF2EC; }
  .rail { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
  .rail-group { display: flex; flex-direction: column; gap: 10px; }
  .rail-group-label {
    font-weight: 600;
    font-size: 13px;
    color: #3B5169;
    padding-bottom: 4px;
    border-bottom: 1px solid #D8DCE1;
  }
  .part-card {
    background: #FFFFFF;
    border: 1px solid #D8DCE1;
    border-radius: 8px;
    overflow: hidden;
  }
  .part-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: transparent;
    border: none;
    border-left: 3px solid transparent;
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: inherit;
  }
  .part-row.open { border-left-color: #1D7A6E; }
  .part-seq {
    font-weight: 600;
    font-size: 13px;
    color: #1D7A6E;
    width: 24px;
    flex-shrink: 0;
  }
  .part-info { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
  .part-name-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .part-name { font-size: 15px; font-weight: 600; }
  .optional-tag {
    font-size: 11px;
    font-weight: 500;
    color: #3B5169;
    background: #EEF1F4;
    padding: 2px 7px;
    border-radius: 10px;
  }
  .part-status { font-size: 13px; }
  .chosen-text { color: #1D7A6E; font-weight: 500; }
  .missing-text { color: #C4501F; font-weight: 500; }
  .suggested-text { color: #9A6B1F; font-weight: 500; }
  .empty-text { color: #8A96A3; }
  .chevron { font-size: 20px; color: #8A96A3; width: 20px; text-align: center; flex-shrink: 0; }
  .option-panel {
    border-top: 1px solid #EEF1F4;
    padding: 14px 16px 16px;
    background: #FBFBFA;
    display: none;
  }
  .option-panel.visible { display: block; }
  .part-desc { font-size: 13px; color: #3B5169; margin: 0 0 12px; line-height: 1.5; }
  .option-list { display: flex; flex-direction: column; gap: 8px; }
  .option-btn {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    border-radius: 6px;
    border: 1px solid #D8DCE1;
    background: #fff;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    color: inherit;
    text-align: left;
    flex: 1;
    min-width: 0;
  }
  .option-btn.active { border-color: #1D7A6E; background: #EAF4F2; }
  .option-price { font-weight: 600; font-size: 13px; color: #0F172A; }
  .minor-group-card {
    background: #FFFFFF;
    border: 1px solid #D8DCE1;
    border-radius: 8px;
    padding: 16px;
  }
  .minor-group-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .minor-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 8px 12px;
  }
  .minor-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 13.5px;
    color: #1F2937;
    min-width: 0;
  }
  .minor-item-label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    min-width: 0;
    flex: 1;
  }
  .minor-item-label span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .minor-item input { width: 15px; height: 15px; accent-color: #1D7A6E; flex-shrink: 0; }
  .minor-info-btn { width: 20px; height: 20px; font-size: 11px; flex-shrink: 0; }
  .summary-panel { min-width: 0; }
  .summary-sticky {
    position: sticky;
    top: 24px;
    background: #FFFFFF;
    border: 1px solid #D8DCE1;
    border-radius: 10px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .summary-header { display: flex; justify-content: space-between; align-items: baseline; }
  .summary-title { font-weight: 600; font-size: 16px; }
  .summary-count { font-size: 12px; color: #8A96A3; }
  .progress-track { height: 4px; background: #EEF1F4; border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: #1D7A6E; transition: width 0.3s ease; }
  .empty-state { font-size: 13.5px; color: #8A96A3; line-height: 1.5; margin: 0; }
  .summary-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
  .summary-item { display: flex; justify-content: space-between; font-size: 13.5px; gap: 8px; }
  .summary-item-name { color: #1F2937; }
  .summary-item-seller { color: #8A96A3; font-size: 12px; }
  .summary-item-price { font-weight: 600; color: #0F172A; flex-shrink: 0; }
  .warning-box {
    background: #FBF2EC;
    border: 1px solid #EBD3C0;
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .warning-line { display: flex; gap: 8px; font-size: 12.5px; line-height: 1.5; color: #5A3A22; }
  .warning-icon {
    background: #C4501F; color: #fff; width: 16px; height: 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
  }
  .warning-icon-soft {
    background: #9A6B1F; color: #fff; width: 16px; height: 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
  }
  .total-row { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid #EEF1F4; padding-top: 14px; }
  .total-label { font-size: 14px; color: #3B5169; }
  .total-value { font-weight: 700; font-size: 22px; }
  .cart-btn {
    width: 100%;
    padding: 13px 16px;
    border-radius: 7px;
    border: none;
    font-size: 14.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .cart-btn.ready { background: #1D7A6E; color: #fff; }
  .cart-btn.disabled { background: #E5E8EB; color: #9AA5B1; cursor: not-allowed; }
  .cart-btn.save-later { background: #3B5169; color: #fff; }
  .save-later-note { font-size: 12px; color: #8A96A3; line-height: 1.5; margin: 8px 0 0; }
  .ready-note { font-size: 12px; color: #8A96A3; line-height: 1.5; margin: 0; }

  .info-btn {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1.5px solid #9FB0C3;
    background: #fff;
    color: #3B5169;
    font-size: 11px;
    font-weight: 700;
    font-style: italic;
    font-family: Georgia, 'Times New Roman', serif;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
    line-height: 1;
  }
  .info-btn:hover { background: #EAF4F2; border-color: #1D7A6E; color: #1D7A6E; }

  .option-row { display: flex; align-items: center; gap: 8px; }
  .option-info-btn {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1.5px solid #9FB0C3;
    background: #fff;
    color: #3B5169;
    font-size: 12px;
    font-weight: 700;
    font-style: italic;
    font-family: Georgia, 'Times New Roman', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
    line-height: 1;
  }
  .option-info-btn:hover { background: #EAF4F2; border-color: #1D7A6E; color: #1D7A6E; }

  .option-block { display: flex; flex-direction: column; gap: 8px; }
  .seller-panel {
    background: #F0F3F5;
    border: 1px dashed #C7CFD6;
    border-radius: 7px;
    padding: 10px 12px 12px;
    margin-left: 4px;
  }
  .seller-panel-label {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #8A96A3;
    margin: 0 0 8px;
  }
  .seller-list { display: flex; flex-direction: column; gap: 6px; }
  .seller-btn {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 12px;
    border-radius: 6px;
    border: 1px solid #D8DCE1;
    background: #fff;
    cursor: pointer;
    font-size: 13.5px;
    font-family: inherit;
    color: inherit;
    text-align: left;
    width: 100%;
  }
  .seller-btn.active { border-color: #1D7A6E; background: #EAF4F2; }
  .seller-name { font-weight: 500; }
  .seller-price { font-weight: 700; color: #0F172A; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.visible { display: flex; }
  .modal-card {
    background: #fff;
    border-radius: 12px;
    max-width: 480px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(15,23,42,0.3);
  }
  .modal-image-wrap {
    background: #F0F3F5;
    border-radius: 12px 12px 0 0;
    padding: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-image-wrap svg { width: 96px; height: 96px; }
  .modal-body { padding: 20px 24px 24px; }
  .modal-header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .modal-title { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
  .modal-group-tag {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 600;
    color: #1D7A6E;
    background: #EAF4F2;
    padding: 3px 9px;
    border-radius: 10px;
    margin-bottom: 10px;
  }
  .modal-close {
    background: #F0F3F5;
    border: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 16px;
    color: #3B5169;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-close:hover { background: #E2E7EA; }
  .modal-desc { font-size: 14px; color: #1F2937; line-height: 1.6; margin: 0 0 16px; }
  .modal-section-label {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #8A96A3;
    margin: 0 0 8px;
  }
  .modal-specs {
    list-style: none;
    margin: 0 0 4px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .modal-specs li {
    font-size: 13.5px;
    color: #1F2937;
    display: flex;
    gap: 8px;
    line-height: 1.5;
  }
  .modal-specs li::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #1D7A6E;
    flex-shrink: 0;
    margin-top: 7px;
  }

  .mock-signin-form { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .mock-signin-label { font-size: 12px; font-weight: 600; color: #3B5169; margin-top: 6px; }
  .mock-signin-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #D8DCE1;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  .mock-signin-submit {
    margin-top: 14px;
    background: #1D7A6E;
    color: #fff;
    border: none;
    padding: 11px 16px;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  /* Cancellation modal */
  .cancel-reason-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .cancel-reason-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid #D8DCE1;
    border-radius: 7px;
    background: #fff;
    cursor: pointer;
    font-size: 13.5px;
    font-family: inherit;
    color: #1F2937;
    text-align: left;
    width: 100%;
  }
  .cancel-reason-btn.active { border-color: #C4501F; background: #FBF2EC; }
  .cancel-reason-radio {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid #9FB0C3;
    flex-shrink: 0;
    position: relative;
  }
  .cancel-reason-btn.active .cancel-reason-radio { border-color: #C4501F; }
  .cancel-reason-btn.active .cancel-reason-radio::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #C4501F;
  }
  .cancel-order-btn {
    background: #fff;
    color: #C4501F;
    border: 1px solid #EBD3C0;
    padding: 8px 14px;
    border-radius: 7px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    margin-top: 10px;

// ---------------------------------------------------------------------------
// STATE
// ---------------------------------------------------------------------------
const state = {
  selections: {},   // partId -> optionId
  minorSelected: {},// itemName -> bool
  openPart: MAJOR_PARTS[0].id,
  added: false,
  navOpen: false,
  savedJustNow: false,
  view: "home", // "home" | "builder" | "myBuilds" | "cart"
  googleUser: null, // null when signed out, otherwise { email, name }
  saveDestination: "browser", // "browser" | "google" — where the next save goes
  activeBuildId: null,       // id of the saved build currently loaded, if any
  activeBuildDestination: null, // "browser" | "google" — where that saved build lives
  checkoutStep: "cart", // "cart" | "address" | "payment" | "confirmation"
  deliveryAddress: null, // filled in during checkout
  paymentMethod: "card", // "card" | "upi" | "cod"
  lastOrder: null,
};

// ---------------------------------------------------------------------------
// SAVED BUILDS STORAGE
//
// Two save destinations are supported:
//   1. "browser"  — always available, tied only to this device/browser.
//   2. "google"   — intended to sync a signed-in Google user's builds across
//                   devices. Real cross-device sync needs a backend (e.g.
//                   Google Identity Services for login + a database or
//                   Google Drive API for storage), which isn't wired up yet.
//
// TODO (when ready to go live with Google):
//   - Replace mockGoogleSignIn() with real Google Identity Services sign-in.
//   - Replace the localStorage read/write below for "google" saves with
//     real API calls to your backend (or Google Drive AppData), keyed by
//     the signed-in user's account id.
// For now, "google" saves are still physically kept in this browser's
// localStorage, just stored under a separate key per email, so the two
// destinations behave distinctly in the UI ahead of the real integration.
// ---------------------------------------------------------------------------

const BROWSER_BUILDS_KEY = "ro_configurator_saved_builds_browser";
const GOOGLE_USER_KEY = "ro_configurator_mock_google_user";

function googleBuildsKey(email) {
  return "ro_configurator_saved_builds_google_" + email.toLowerCase();
}

function loadSavedBuilds(destination) {
  const key = destination === "google" && state.googleUser
    ? googleBuildsKey(state.googleUser.email)
    : BROWSER_BUILDS_KEY;
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function writeSavedBuilds(destination, builds) {
  const key = destination === "google" && state.googleUser
    ? googleBuildsKey(state.googleUser.email)
    : BROWSER_BUILDS_KEY;
  try {
    localStorage.setItem(key, JSON.stringify(builds));
    return true;
  } catch (e) {
    return false;
  }
}

function loadGoogleUser() {
  try {
    const raw = localStorage.getItem(GOOGLE_USER_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function persistGoogleUser(user) {
  try {
    if (user) localStorage.setItem(GOOGLE_USER_KEY, JSON.stringify(user));
    else localStorage.removeItem(GOOGLE_USER_KEY);
  } catch (e) { /* ignore */ }
}

function buildSummaryForSave(destination, existingId) {
  const chosenParts = MAJOR_PARTS.filter((p) => state.selections[p.id]);
  const total = chosenParts.reduce((sum, p) => {
    const info = getChosenOptionAndSeller(p);
    return sum + (info ? info.seller.price : 0);
  }, 0) + Object.values(state.minorSelected).filter(Boolean).length * MINOR_PRICE;
  return {
    id: existingId || ("build_" + Date.now()),
    savedAt: new Date().toISOString(),
    savedTo: destination, // "browser" | "google"
    selections: JSON.parse(JSON.stringify(state.selections)),
    minorSelected: JSON.parse(JSON.stringify(state.minorSelected)),
    partsCount: chosenParts.length,
    totalPartsCount: MAJOR_PARTS.length,
    total: total,
    partNames: chosenParts.map((p) => p.name),
  };
}

function saveBuildForLater() {
  const destination = state.saveDestination === "google" && state.googleUser ? "google" : "browser";
  const builds = loadSavedBuilds(destination);

  // If a build from this same destination is already active (either resumed
  // from My Builds, or saved earlier in this session), update it in place
  // instead of creating a duplicate entry.
  const existingIndex = state.activeBuildId && state.activeBuildDestination === destination
    ? builds.findIndex((x) => x.id === state.activeBuildId)
    : -1;

  if (existingIndex !== -1) {
    builds[existingIndex] = buildSummaryForSave(destination, state.activeBuildId);
  } else {
    const newBuild = buildSummaryForSave(destination);
    builds.unshift(newBuild);
    state.activeBuildId = newBuild.id;
    state.activeBuildDestination = destination;
  }

  const ok = writeSavedBuilds(destination, builds);
  if (ok) {
    state.savedJustNow = true;
    render();
    setTimeout(() => { state.savedJustNow = false; render(); }, 3500);
  }
}

function resumeBuild(buildId, destination) {
  const builds = loadSavedBuilds(destination);
  const b = builds.find((x) => x.id === buildId);
  if (!b) return;
  state.selections = JSON.parse(JSON.stringify(b.selections));
  state.minorSelected = JSON.parse(JSON.stringify(b.minorSelected));
  state.added = false;
  state.view = "builder";
  state.activeBuildId = b.id;
  state.activeBuildDestination = destination;
  state.saveDestination = destination;
  closeNavDrawer();
  switchView();
  render();
  renderNav();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function deleteSavedBuild(buildId, destination, evt) {
  if (evt) evt.stopPropagation();
  const builds = loadSavedBuilds(destination).filter((x) => x.id !== buildId);
  writeSavedBuilds(destination, builds);
  if (state.activeBuildId === buildId && state.activeBuildDestination === destination) {
    state.activeBuildId = null;
    state.activeBuildDestination = null;
  }
  renderMyBuilds();
}

function formatSavedDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) +
    " · " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}

}

function currency(n) {
  return "₹" + n.toLocaleString("en-IN");
}

function partName(id) {
  const found = MAJOR_PARTS.find((p) => p.id === id);
  return found ? found.name : id;
}

function groupParts() {
  const g = {};
  const order = [];
  MAJOR_PARTS.forEach((p) => {
    if (!g[p.group]) { g[p.group] = []; order.push(p.group); }
    g[p.group].push(p);
  });
  return { g, order };
}

function findOption(partId, optionId) {
  const p = MAJOR_PARTS.find((x) => x.id === partId);
  if (!p) return null;
  return p.options.find((o) => o.id === optionId) || null;
}

function cheapestSeller(option) {
  return option.sellers.slice().sort((a, b) => a.price - b.price)[0];
}

function selectOption(partId, optionId) {
  const current = state.selections[partId];
  if (current && current.optionId === optionId) {
    delete state.selections[partId];
  } else {
    const opt = findOption(partId, optionId);
    const defaultSeller = opt ? cheapestSeller(opt).name : null;
    state.selections[partId] = { optionId, seller: defaultSeller };
  }
  state.added = false;
  render();
}

function selectSeller(partId, optionId, sellerName, evt) {
  if (evt) evt.stopPropagation();
  const current = state.selections[partId];
  if (!current || current.optionId !== optionId) return;
  state.selections[partId] = { optionId, seller: sellerName };
  state.added = false;
  render();
}

function getChosenOptionAndSeller(p) {
  const sel = state.selections[p.id];
  if (!sel) return null;
  const opt = p.options.find((o) => o.id === sel.optionId);
  if (!opt) return null;
  const seller = opt.sellers.find((s) => s.name === sel.seller) || cheapestSeller(opt);
  return { opt, seller };
}

function toggleOpen(partId) {
  state.openPart = state.openPart === partId ? null : partId;
  render();
}

function toggleMinor(name) {
  state.minorSelected[name] = !state.minorSelected[name];
  state.added = false;
  render();
}

const CART_KEY = "ro_configurator_cart";
const ORDER_ADDRESS_KEY = "ro_configurator_delivery_address";

// Cart shape: { items: [ {source, ...itemFields} ], minorCount, minorTotal }
// "items" accumulates from any entry point (full builder, ready-made models,
// or the parts-only catalog) rather than being overwritten each time.

function loadCart() {
  try {
    const raw = localStorage.getItem(CART_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    if (!parsed) return { items: [], minorCount: 0, minorTotal: 0 };
    if (!Array.isArray(parsed.items)) parsed.items = [];
    return parsed;
  } catch (e) {
    return { items: [], minorCount: 0, minorTotal: 0 };
  }
}

function writeCart(cart) {
  try {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    return true;
  } catch (e) {
    return false;
  }
}

function cartTotal(cart) {
  const itemsTotal = cart.items.reduce((s, i) => s + i.price, 0);
  return itemsTotal + (cart.minorTotal || 0);
}

function addLineItemToCart(item) {
  const cart = loadCart();
  cart.items.push(item);
  writeCart(cart);
}

function buildCartSnapshot() {
  const chosenParts = MAJOR_PARTS.filter((p) => state.selections[p.id]);
  const items = chosenParts.map((p) => {
    const info = getChosenOptionAndSeller(p);
    return {
      source: "builder",
      partId: p.id,
      name: p.name,
      optionLabel: info.opt.label,
      seller: info.seller.name,
      price: info.seller.price,
    };
  });
  const minorCount = Object.values(state.minorSelected).filter(Boolean).length;
  const minorTotal = minorCount * MINOR_PRICE;
  return { items, minorCount, minorTotal };
}

function addToCart() {
  // A full completed build replaces any previous "builder"-sourced items,
  // but leaves ready-made / parts-only items already in the cart untouched.
  const existing = loadCart();
  const nonBuilderItems = existing.items.filter((i) => i.source !== "builder");
  const snapshot = buildCartSnapshot();
  const cart = {
    items: [...nonBuilderItems, ...snapshot.items],
    minorCount: snapshot.minorCount,
    minorTotal: snapshot.minorTotal,
  };
  writeCart(cart);
  state.added = true;
  render();
}

function goToCart() {
  state.view = "cart";
  state.checkoutStep = "cart";
  switchView();
  renderNav();
  renderCheckout();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function removeCartItem(index) {
  const cart = loadCart();
  cart.items.splice(index, 1);
  writeCart(cart);
  renderCheckout();
}

// CANCELLATION (shared by RO orders and servicing bookings)
// ---------------------------------------------------------------------------
const CANCELLATION_REASONS = [
  "Ordered by mistake",
  "Found a better price elsewhere",
  "Delivery/service is taking too long",
  "Changed my mind",
  "Need to change the address or details",
  "Other",
];

const cancelModalState = { kind: null, id: null, selectedReason: null };

function openCancelModal(kind, id) {
  cancelModalState.kind = kind; // "order" | "booking"
  cancelModalState.id = id;
  cancelModalState.selectedReason = null;

  const reasonsHtml = CANCELLATION_REASONS.map((r, idx) => `
    <button class="cancel-reason-btn" id="cancelReasonBtn${idx}" onclick="selectCancelReason(${idx})">
      <span class="cancel-reason-radio"></span>
      <span>${esc(r)}</span>
    </button>
  `).join("");

  document.getElementById("modalCard").innerHTML = `
    <div class="modal-body" style="padding-top:24px;">
      <div class="modal-header-row">
        <div>
          <span class="modal-group-tag">${kind === "order" ? "Cancel Order" : "Cancel Servicing"}</span>
          <h3 class="modal-title">Why are you cancelling?</h3>
        </div>
        <button class="modal-close" onclick="closeInfoModal()" aria-label="Close">✕</button>
      </div>
      <p class="modal-desc">Please select a reason. This helps us understand what went wrong.</p>
      <div class="cancel-reason-list">${reasonsHtml}</div>
      <div id="cancelOtherWrap" style="display:none;">
        <label class="mock-signin-label" style="margin-top:10px;">Please specify</label>
        <input type="text" id="cancelOtherText" class="mock-signin-input" placeholder="Tell us more" />
      </div>
      <p id="cancelReasonError" class="address-form-error" style="display:none; margin-top:12px;">Please select a reason to continue.</p>
      <button class="mock-signin-submit" style="background:#C4501F;" onclick="confirmCancellation()">Confirm Cancellation</button>
    </div>
  `;
  document.getElementById("modalOverlay").classList.add("visible");
}

function selectCancelReason(idx) {
  cancelModalState.selectedReason = CANCELLATION_REASONS[idx];
  CANCELLATION_REASONS.forEach((r, i) => {
    const btn = document.getElementById("cancelReasonBtn" + i);
    if (btn) btn.classList.toggle("active", i === idx);
  });
  const otherWrap = document.getElementById("cancelOtherWrap");
  if (otherWrap) otherWrap.style.display = CANCELLATION_REASONS[idx] === "Other" ? "block" : "none";
  const errEl = document.getElementById("cancelReasonError");
  if (errEl) errEl.style.display = "none";
}

function confirmCancellation() {
  if (!cancelModalState.selectedReason) {
    const errEl = document.getElementById("cancelReasonError");
    if (errEl) errEl.style.display = "block";
    return;
  }
  let reasonText = cancelModalState.selectedReason;
  if (reasonText === "Other") {
    const otherEl = document.getElementById("cancelOtherText");
    const otherVal = otherEl ? otherEl.value.trim() : "";
    reasonText = otherVal ? "Other: " + otherVal : "Other";
  }

  if (cancelModalState.kind === "order") {
    applyOrderCancellation(cancelModalState.id, reasonText);
  } else if (cancelModalState.kind === "booking") {
    applyBookingCancellation(cancelModalState.id, reasonText);
  }
  closeInfoModal();
}

function applyOrderCancellation(orderId, reason) {
  const orders = loadOrderHistory();
  const order = orders.find((o) => o.id === orderId);
  if (!order) return;
  order.status = "Cancelled";
  order.cancellationReason = reason;
  order.cancelledAt = new Date().toISOString();
  try {
    localStorage.setItem(orderHistoryKey(), JSON.stringify(orders));
  } catch (e) { /* ignore */ }
  renderOrderHistory();
}

function applyBookingCancellation(bookingId, reason) {
  const bookings = loadServiceBookings();
  const booking = bookings.find((b) => b.id === bookingId);
  if (!booking) return;
  booking.status = "Cancelled";
  booking.cancellationReason = reason;
  booking.cancelledAt = new Date().toISOString();
  try {
    localStorage.setItem(serviceBookingsKey(), JSON.stringify(bookings));
  } catch (e) { /* ignore */ }
  renderBookServicing();
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderRail() {
  const { g, order } = groupParts();
  let html = "";

  order.forEach((groupName) => {
    html += `<div class="rail-group"><div class="rail-group-label">${esc(groupName)}</div>`;
    g[groupName].forEach((p) => {
      const chosenInfo = getChosenOptionAndSeller(p);
      const chosenOptionId = state.selections[p.id] ? state.selections[p.id].optionId : null;
      const isOpen = state.openPart === p.id;
      const isMissing = REQUIRED_CORE.includes(p.id) && !chosenInfo;
      const suggestions = getSuggestions();
      const isSuggested = suggestions.includes(p.id) && !chosenInfo;

      let statusHtml;
      if (chosenInfo) {
        statusHtml = `<span class="chosen-text">${esc(chosenInfo.opt.label)} · ${esc(chosenInfo.seller.name)} · ${currency(chosenInfo.seller.price)}</span>`;
      } else if (isMissing) {
        statusHtml = `<span class="missing-text">Required — not selected</span>`;
      } else if (isSuggested) {
        statusHtml = `<span class="suggested-text">Suggested to complete your build</span>`;
      } else {
        statusHtml = `<span class="empty-text">Not selected</span>`;
      }

      html += `
        <div class="part-card">
          <button class="part-row ${isOpen ? 'open' : ''}" onclick="toggleOpen('${p.id}')">
            <span class="part-seq">${String(p.seq).padStart(2, "0")}</span>
            <span class="part-info">
              <span class="part-name-row">
                <span class="part-name">${esc(p.name)}</span>
                <button class="info-btn" onclick="showInfoModal('${p.id}', event)" aria-label="More info about ${esc(p.name)}">i</button>
                ${p.optional ? '<span class="optional-tag">optional</span>' : ''}
              </span>
              <span class="part-status">${statusHtml}</span>
            </span>
            <span class="chevron">${isOpen ? '–' : '+'}</span>
          </button>
          <div class="option-panel ${isOpen ? 'visible' : ''}">
            <p class="part-desc">${esc(p.desc)}</p>
            <div class="option-list">
              ${p.options.map((o) => {
                const isOptionChosen = chosenOptionId === o.id;
                const cheapest = cheapestSeller(o);
                return `
                <div class="option-block">
                  <div class="option-row">
                    <button class="option-btn ${isOptionChosen ? 'active' : ''}" onclick="selectOption('${p.id}','${o.id}')">
                      <span>${esc(o.label)}</span>
                      <span class="option-price">from ${currency(cheapest.price)}</span>
                    </button>
                    ${o.note ? `<button class="option-info-btn" onclick="showOptionInfo('${p.id}','${o.id}', event)" aria-label="More info about ${esc(o.label)}">i</button>` : ""}
                  </div>
                  ${isOptionChosen ? `
                    <div class="seller-panel">
                      <p class="seller-panel-label">Choose seller</p>
                      <div class="seller-list">
                        ${o.sellers.map((s) => `
                          <button class="seller-btn ${chosenInfo && chosenInfo.seller.name === s.name ? 'active' : ''}" onclick="selectSeller('${p.id}','${o.id}','${s.name.replace(/'/g, "\\'")}', event)">
                            <span class="seller-name">${esc(s.name)}</span>
                            <span class="seller-price">${currency(s.price)}</span>
                          </button>
                        `).join("")}
                      </div>
                    </div>
                  ` : ""}
                </div>
              `;}).join("")}
            </div>
          </div>
        </div>
      `;
    });
    html += `</div>`;
  });

  html += `<div class="rail-group"><div class="rail-group-label">Minor & Supporting Parts</div>`;
  MINOR_GROUPS.forEach((mg) => {
    html += `
      <div class="minor-group-card">
        <div class="minor-group-title">${esc(mg.group)}</div>
        <div class="minor-grid">
          ${mg.items.map((item) => `
            <div class="minor-item">
              <label class="minor-item-label">
                <input type="checkbox" ${state.minorSelected[item.name] ? 'checked' : ''} onchange="toggleMinor('${item.name.replace(/'/g, "\\'")}')" />
                <span>${esc(item.name)}</span>
              </label>
              <button class="option-info-btn minor-info-btn" onclick="showMinorInfo('${mg.group.replace(/'/g, "\\'")}','${item.name.replace(/'/g, "\\'")}', event)" aria-label="More info about ${esc(item.name)}">i</button>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  });
  html += `</div>`;

  document.getElementById("rail").innerHTML = html;
}

function getSuggestions() {
  const suggestions = [];
  MAJOR_PARTS.forEach((p) => {
    if (state.selections[p.id] && p.requiresSuggested) {
      p.requiresSuggested.forEach((reqId) => {
        if (!state.selections[reqId] && !suggestions.includes(reqId)) suggestions.push(reqId);
      });
    }
  });
  return suggestions;
}

function renderSummary() {
  const chosenParts = MAJOR_PARTS.filter((p) => state.selections[p.id]);
  const majorTotal = chosenParts.reduce((sum, p) => {
    const info = getChosenOptionAndSeller(p);
    return sum + (info ? info.seller.price : 0);
  }, 0);
  const minorCount = Object.values(state.minorSelected).filter(Boolean).length;
  const minorTotal = minorCount * MINOR_PRICE;
  const total = majorTotal + minorTotal;
  const missingRequired = REQUIRED_CORE.filter((id) => !state.selections[id]);
  const suggestions = getSuggestions();
  const isReady = missingRequired.length === 0;
  const pct = (chosenParts.length / MAJOR_PARTS.length) * 100;

  let listHtml;
  if (chosenParts.length === 0) {
    listHtml = `<p class="empty-state">Nothing selected yet. Choose parts on the left — your build list fills in as you go.</p>`;
  } else {
    listHtml = `<ul class="summary-list">`;
    chosenParts.forEach((p) => {
      const info = getChosenOptionAndSeller(p);
      listHtml += `<li class="summary-item"><span class="summary-item-name">${esc(p.name)} <span class="summary-item-seller">(${esc(info.seller.name)})</span></span><span class="summary-item-price">${currency(info.seller.price)}</span></li>`;
    });
    if (minorCount > 0) {
      listHtml += `<li class="summary-item"><span class="summary-item-name">Minor parts (${minorCount})</span><span class="summary-item-price">${currency(minorTotal)}</span></li>`;
    }
    listHtml += `</ul>`;
  }

  let warningHtml = "";
  if (missingRequired.length > 0 || suggestions.length > 0) {
    warningHtml = `<div class="warning-box">`;
    if (missingRequired.length > 0) {
      warningHtml += `
        <div class="warning-line">
          <span class="warning-icon">!</span>
          <span><strong>Missing required:</strong> ${missingRequired.map(partName).map(esc).join(", ")}</span>
        </div>`;
    }
    if (suggestions.length > 0) {
      warningHtml += `
        <div class="warning-line">
          <span class="warning-icon-soft">+</span>
          <span><strong>Suggested:</strong> ${suggestions.map(partName).map(esc).join(", ")} — pairs with parts you've already picked.</span>
        </div>`;
    }
    warningHtml += `</div>`;
  }

  const readyNote = isReady ? `<p class="ready-note">Your purifier has every required part. Optional stages (UV, alkaline, copper, TDS control) can still be added above.</p>` : "";

  const destToggleHtml = `
    <div class="save-destination-toggle">
      <button class="save-dest-btn ${state.saveDestination === 'browser' ? 'active' : ''}" onclick="setSaveDestination('browser')">This browser</button>
      <button class="save-dest-btn ${state.saveDestination === 'google' ? 'active' : ''}" onclick="setSaveDestination('google')">${state.googleUser ? esc(state.googleUser.email) : 'Google account'}</button>
    </div>
  `;

  let actionHtml;
  if (isReady && state.added) {
    actionHtml = `
      <div class="added-confirm">Added to cart ✓</div>
      <button class="cart-btn go-to-cart" onclick="goToCart()">Go to cart</button>
    `;
  } else if (isReady) {
    actionHtml = `<button class="cart-btn ready" onclick="addToCart()">Add to cart</button>`;
  } else {
    actionHtml = `${destToggleHtml}
       <button class="cart-btn save-later" onclick="saveBuildForLater()">${state.savedJustNow ? "Saved ✓ — find it in My Builds" : "Save & build later"}</button>
       <p class="save-later-note">Not ready yet? Save your progress to this browser, or to a Google account so it can follow you across devices once that's connected.</p>`;
  }

  document.getElementById("summary").innerHTML = `
    <div class="summary-header">
      <span class="summary-title">Your build</span>
      <span class="summary-count">${chosenParts.length}/${MAJOR_PARTS.length} major parts</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    ${listHtml}
    ${warningHtml}
    <div class="total-row">
      <span class="total-label">Total</span>
      <span class="total-value">${currency(total)}</span>
    </div>
    ${actionHtml}
    ${readyNote}
  `;
}

}

function proceedToPayment() {
  const form = document.getElementById("addressForm");
  if (!form) return;
  const fields = ["fullName", "phone", "line1", "city", "stateName", "pincode"];
  const values = {};
  let hasError = false;
  fields.forEach((f) => {
    const el = document.getElementById("addr_" + f);
    const val = el ? el.value.trim() : "";
    values[f] = val;
    if (!val) {
      hasError = true;
      if (el) el.style.borderColor = "#C4501F";
    } else if (el) {
      el.style.borderColor = "#D8DCE1";
    }
  });
  const line2El = document.getElementById("addr_line2");
  values.line2 = line2El ? line2El.value.trim() : "";

  if (hasError) {
    const errEl = document.getElementById("addressFormError");
    if (errEl) errEl.style.display = "block";
    return;
  }

  state.deliveryAddress = values;
  saveDeliveryAddress(values);
  goToStep("payment");
}

function backToCart() {
  goToStep("cart");
}

function backToAddress() {
  goToStep("address");
}

function setPaymentMethod(method) {
  state.paymentMethod = method;
  renderCheckout();
}

const ORDER_HISTORY_KEY_BROWSER = "ro_configurator_order_history_browser";

function orderHistoryKey() {
  if (state.googleUser) return "ro_configurator_order_history_google_" + state.googleUser.email.toLowerCase();
  return ORDER_HISTORY_KEY_BROWSER;
}

function loadOrderHistory() {
  try {
    const raw = localStorage.getItem(orderHistoryKey());
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveOrderToHistory(order) {
  try {
    const history = loadOrderHistory();
    history.unshift(order);
    localStorage.setItem(orderHistoryKey(), JSON.stringify(history));
    return true;
  } catch (e) {
    return false;
  }
}

function placeOrder() {
  const cart = loadCart();
  const order = {
    id: "ORD" + Date.now().toString().slice(-8),
    placedAt: new Date().toISOString(),
    items: cart.items,
    minorCount: cart.minorCount || 0,
    minorTotal: cart.minorTotal || 0,
    total: cartTotal(cart),
    address: state.deliveryAddress,
    paymentMethod: state.paymentMethod,
    status: "Placed",
    savedTo: state.googleUser ? "google" : "browser",
  };
  state.lastOrder = order;
  saveOrderToHistory(order);
  try { localStorage.removeItem(CART_KEY); } catch (e) { /* ignore */ }
  goToStep("confirmation");
}

function startNewBuildAfterOrder() {
  state.selections = {};
  state.minorSelected = {};
  state.added = false;
  state.activeBuildId = null;
  state.activeBuildDestination = null;
  state.checkoutStep = "cart";
  state.view = "builder";
  switchView();
  render();
  renderNav();
}

  const step = state.checkoutStep;

  const stepsBarHtml = `
    <div class="checkout-steps">
      <span class="checkout-step ${step === 'cart' ? 'active' : (step !== 'cart' ? 'done' : '')}">1. Cart</span>
      <span class="checkout-step-sep">›</span>
      <span class="checkout-step ${step === 'address' ? 'active' : (step === 'payment' || step === 'confirmation' ? 'done' : '')}">2. Address</span>
      <span class="checkout-step-sep">›</span>
      <span class="checkout-step ${step === 'payment' ? 'active' : (step === 'confirmation' ? 'done' : '')}">3. Payment</span>
    </div>
  `;

  if (step === "cart") {
    const cart = loadCart();
    if (!cart.items.length) {

          <p class="my-builds-sub">Nothing in your cart yet.</p>
        </div>

          <br/>

        </div>
      `;

    }
    const sourceLabel = { builder: "Custom build", readyMade: "Ready-made", partsOnly: "Part" };
    const itemsHtml = cart.items.map((i, idx) => `
      <div class="cart-item-row">
        <div class="cart-item-info">
          <div class="cart-item-name">${esc(i.name)} <span class="saved-build-source-tag browser">${esc(sourceLabel[i.source] || "Item")}</span></div>
          <div class="cart-item-sub">${esc(i.optionLabel || "")}${i.seller ? " · " + esc(i.seller) : ""}</div>
        </div>
        <div class="cart-item-price-col">
          <div class="cart-item-price">${currency(i.price)}</div>
          <button class="cart-item-remove" onclick="removeCartItem(${idx})">Remove</button>
        </div>
      </div>
    `).join("");
    const minorRow = cart.minorCount > 0 ? `
      <div class="cart-item-row">
        <div class="cart-item-info">
          <div class="cart-item-name">Minor parts (${cart.minorCount})</div>
        </div>
        <div class="cart-item-price">${currency(cart.minorTotal)}</div>
      </div>
    ` : "";

    container.innerHTML = `
      <div class="my-builds-header">
        <h2 class="my-builds-title">Your Cart</h2>
        <p class="my-builds-sub">Review everything before checking out.</p>
      </div>
      ${stepsBarHtml}
      <div class="checkout-card">
        ${itemsHtml}
        ${minorRow}
        <div class="cart-total-row">
          <span>Total</span>
          <span class="cart-total-value">${currency(cartTotal(cart))}</span>
        </div>
      </div>
      <button class="cart-btn ready" onclick="proceedToAddress()">Proceed to Buy</button>
      <button class="back-link-btn" onclick="navLinkClick('Build Your Purifier')">← Keep editing build</button>
    `;
    return;
  }

  if (step === "address") {
    const saved = state.deliveryAddress || loadDeliveryAddress() || {};
    container.innerHTML = `
      <div class="my-builds-header">
        <h2 class="my-builds-title">Delivery Address</h2>
        <p class="my-builds-sub">Tell us where to deliver your purifier.</p>
      </div>
      ${stepsBarHtml}
      <div class="checkout-card">
        <p id="addressFormError" class="address-form-error" style="display:none;">Please fill in all required fields.</p>
        <div class="address-form" id="addressForm">
          <label class="mock-signin-label">Full name*</label>
          <input type="text" id="addr_fullName" class="mock-signin-input" value="${esc(saved.fullName || '')}" placeholder="e.g. Priya Sharma" />

          <label class="mock-signin-label">Phone number*</label>
          <input type="tel" id="addr_phone" class="mock-signin-input" value="${esc(saved.phone || '')}" placeholder="e.g. 98765 43210" />

          <label class="mock-signin-label">Address line 1*</label>
          <input type="text" id="addr_line1" class="mock-signin-input" value="${esc(saved.line1 || '')}" placeholder="House no., street, area" />

          <label class="mock-signin-label">Address line 2 (optional)</label>
          <input type="text" id="addr_line2" class="mock-signin-input" value="${esc(saved.line2 || '')}" placeholder="Landmark, apartment, etc." />

          <div class="address-form-row">
            <div>
              <label class="mock-signin-label">City*</label>

            </div>
            <div>
              <label class="mock-signin-label">State*</label>
              <input type="text" id="addr_stateName" class="mock-signin-input" value="${esc(saved.stateName || '')}" placeholder="State" />

          <input type="text" id="addr_pincode" class="mock-signin-input" value="${esc(saved.pincode || '')}" placeholder="6-digit pincode" />

      { id: "upi", label: "UPI", note: "Pay via any UPI app using a QR code or ID." },

    return;
  }

  if (step === "confirmation") {
    const order = state.lastOrder;
    if (!order) {
      container.innerHTML = `<div class="my-builds-empty">No recent order found. <button class="back-to-builder-btn" onclick="navLinkClick('Build Your Purifier')">Go to builder</button></div>`;

    }
    container.innerHTML = `
      <div class="order-confirm-wrap">
        <div class="order-confirm-tick">✓</div>
        <h2 class="my-builds-title" style="text-align:center;">Order placed!</h2>
        <p class="my-builds-sub" style="text-align:center;">Order ID: ${esc(order.id)}</p>
        <div class="checkout-card">
          <p class="modal-section-label">Delivering to</p>
          <p class="order-confirm-address">

            ${esc(order.address.line1)}${order.address.line2 ? ", " + esc(order.address.line2) : ""}<br/>
            ${esc(order.address.city)}, ${esc(order.address.stateName)} – ${esc(order.address.pincode)}
          </p>
          <p class="modal-section-label" style="margin-top:14px;">Payment method</p>
          <p class="order-confirm-address">${order.paymentMethod === 'cod' ? 'Cash on Delivery' : order.paymentMethod === 'upi' ? 'UPI' : 'Credit / Debit Card'}</p>
          <div class="cart-total-row" style="margin-top:14px;">
            <span>Total paid</span>
            <span class="cart-total-value">${currency(order.total)}</span>
          </div>
        </div>
        <button class="cart-btn ready" onclick="startNewBuildAfterOrder()">Start a new build</button>

      </div>

    return;

function formatOrderDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) +
    " · " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}

function renderOrderHistory() {
  const orders = loadOrderHistory();
  const container = document.getElementById("orderHistoryView");
  const scopeLabel = state.googleUser ? esc(state.googleUser.email) : "this browser";

  if (orders.length === 0) {
    container.innerHTML = `
      <div class="my-builds-header">
        <h2 class="my-builds-title">Order History</h2>
        <p class="my-builds-sub">Orders placed from ${scopeLabel} will show up here.</p>
      </div>
      <div class="my-builds-empty">
        You haven't placed any orders yet.
        <br/>
        <button class="back-to-builder-btn" onclick="navLinkClick('Build Your Purifier')">Go to builder</button>
      </div>
    `;
    return;
  }

  const cardsHtml = orders.map((o) => {
    const itemsPreview = (o.items || []).map((i) => i.name);
    const preview = itemsPreview.length > 0
      ? itemsPreview.slice(0, 4).join(", ") + (itemsPreview.length > 4 ? `, +${itemsPreview.length - 4} more` : "")
      : "No item details";
    const payLabel = o.paymentMethod === "cod" ? "Cash on Delivery" : o.paymentMethod === "upi" ? "UPI" : "Credit / Debit Card";
    const isCancelled = o.status === "Cancelled";
    const statusTag = isCancelled
      ? `<span class="saved-build-source-tag cancelled">Cancelled</span>`
      : "";
    return `
      <div class="saved-build-card">
        <div class="saved-build-top">
          <div>
            <p class="saved-build-date">Order ${esc(o.id)} · ${esc(formatOrderDate(o.placedAt))}</p>
            <p class="saved-build-progress">${esc(o.status || "Placed")} · ${esc(payLabel)} ${statusTag}</p>
          </div>
          <span class="saved-build-total">${currency(o.total)}</span>
        </div>
        <p class="saved-build-parts">${esc(preview)}</p>
        ${o.address ? `<p class="saved-build-parts">Delivering to ${esc(o.address.city)}, ${esc(o.address.stateName)} – ${esc(o.address.pincode)}</p>` : ""}
        ${isCancelled
          ? `<p class="cancellation-note">Cancelled: ${esc(o.cancellationReason || "No reason given")}</p>`
          : `<button class="cancel-order-btn" onclick="openCancelModal('order','${o.id}')">Cancel Order</button>`}
      </div>
    `;
  }).join("");

  container.innerHTML = `
    <div class="my-builds-header">
      <h2 class="my-builds-title">Order History</h2>
      <p class="my-builds-sub">${orders.length} order${orders.length === 1 ? "" : "s"} placed from ${scopeLabel}.</p>
    </div>
    ${cardsHtml}
  `;
}

const readyMadeAddedFlags = {};

function addReadyMadeToCart(modelId) {
  const model = READY_MADE_MODELS.find((m) => m.id === modelId);
  if (!model) return;
  addLineItemToCart({
    source: "readyMade",
    name: model.name,
    optionLabel: "Ready-made purifier",
    seller: "AquaClear",
    price: model.price,
  });
  readyMadeAddedFlags[modelId] = true;
  renderReadyMade();
  setTimeout(() => { readyMadeAddedFlags[modelId] = false; renderReadyMade(); }, 2000);
}

function renderReadyMade() {
  const container = document.getElementById("readyMadeView");
  const cardsHtml = READY_MADE_MODELS.map((m) => {
    const media = partMediaHtml(m, 40);
    const added = readyMadeAddedFlags[m.id];
    return `
      <div class="model-card">
        <div class="model-card-icon">${media}</div>
        <h3 class="model-card-name">${esc(m.name)}</h3>
        <p class="model-card-tagline">${esc(m.tagline)}</p>
        <ul class="model-card-specs">${m.specs.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>
        <div class="model-card-footer">
          <span class="model-card-price">${currency(m.price)}</span>
          <button class="model-add-btn ${added ? 'added' : ''}" onclick="addReadyMadeToCart('${m.id}')">${added ? 'Added ✓' : 'Add to cart'}</button>
        </div>
      </div>
    `;
  }).join("");

  container.innerHTML = `
    <div class="my-builds-header">
      <h2 class="my-builds-title">Buy Ready Made</h2>
      <p class="my-builds-sub">Pre-built purifiers, ready to order — no assembly required.</p>
    </div>
    <div class="catalog-grid">${cardsHtml}</div>
  `;
}

// BUY PARTS ONLY

const partsOnlyAddedFlags = {}; // key: partId + optionId + sellerName

function addPartOnlyToCart(partId, optionId, sellerName) {
  const p = MAJOR_PARTS.find((x) => x.id === partId);
  if (!p) return;
  const opt = p.options.find((o) => o.id === optionId);
  if (!opt) return;
  const seller = opt.sellers.find((s) => s.name === sellerName);
  if (!seller) return;
  addLineItemToCart({
    source: "partsOnly",
    partId: p.id,
    name: p.name,
    optionLabel: opt.label,
    seller: seller.name,
    price: seller.price,
  });
  const key = partId + "|" + optionId + "|" + sellerName;
  partsOnlyAddedFlags[key] = true;
  renderPartsOnly();
  setTimeout(() => { partsOnlyAddedFlags[key] = false; renderPartsOnly(); }, 2000);
}

function renderPartsOnly() {
  const container = document.getElementById("partsOnlyView");
  const { g, order } = groupParts();

  const groupsHtml = order.map((groupName) => {
    const partsHtml = g[groupName].map((p) => {
      const optionsHtml = p.options.map((o) => {
        const sellerRows = o.sellers.map((s) => {
          const key = p.id + "|" + o.id + "|" + s.name;
          const added = partsOnlyAddedFlags[key];
          return `
            <div class="part-catalog-option-row">
              <div class="part-catalog-option-info">
                <span class="part-catalog-option-label">${esc(o.label)}</span>
                <span class="part-catalog-option-seller">${esc(s.name)}</span>
              </div>
              <div class="part-catalog-option-right">
                <span class="part-catalog-price">${currency(s.price)}</span>
                <button class="part-catalog-add-btn ${added ? 'added' : ''}" onclick="addPartOnlyToCart('${p.id}','${o.id}','${s.name.replace(/'/g, "\\'")}')">${added ? 'Added ✓' : 'Add'}</button>
              </div>
            </div>
          `;
        }).join("");
        const optionInfoBtn = o.note
          ? `<button class="option-info-btn" onclick="showOptionInfo('${p.id}','${o.id}', event)" aria-label="More info about ${esc(o.label)}">i</button>`
          : "";
        return `
          <div class="part-catalog-option-block">
            <div class="part-catalog-option-group">
              ${sellerRows}
            </div>
            ${optionInfoBtn}
          </div>
        `;
      }).join("");
      return `
        <div class="part-catalog-card">
          <div class="part-catalog-name-row">
            <h4 class="part-catalog-name">${esc(p.name)}</h4>
            <button class="info-btn" onclick="showInfoModal('${p.id}', event)" aria-label="More info about ${esc(p.name)}">i</button>
          </div>
          <div class="part-catalog-options">${optionsHtml}</div>
        </div>
      `;
    }).join("");
    return `
      <div class="parts-catalog-group">
        <div class="parts-catalog-group-title">${esc(groupName)}</div>
        ${partsHtml}
      </div>
    `;
  }).join("");

  const cart = loadCart();
  const miniCartHtml = cart.items.length > 0 ? `
    <div class="sticky-mini-cart">
      <span class="sticky-mini-cart-text">${cart.items.length} item${cart.items.length === 1 ? "" : "s"} in cart · ${currency(cartTotal(cart))}</span>
      <button class="sticky-mini-cart-btn" onclick="goToCart()">Go to cart</button>
    </div>
  ` : "";

  container.innerHTML = `
    <div class="my-builds-header">
      <h2 class="my-builds-title">Buy Parts Only</h2>
      <p class="my-builds-sub">Browse and buy individual parts directly, without going through the full builder.</p>
    </div>
    ${groupsHtml}
    ${miniCartHtml}
  `;
}

const SERVICE_BOOKINGS_KEY_BROWSER = "ro_configurator_service_bookings_browser";

function serviceBookingsKey() {
  if (state.googleUser) return "ro_configurator_service_bookings_google_" + state.googleUser.email.toLowerCase();
  return SERVICE_BOOKINGS_KEY_BROWSER;
}

function loadServiceBookings() {
  try {
    const raw = localStorage.getItem(serviceBookingsKey());
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveServiceBooking(booking) {
  try {
    const bookings = loadServiceBookings();
    bookings.unshift(booking);
    localStorage.setItem(serviceBookingsKey(), JSON.stringify(bookings));
    return true;
  } catch (e) {
    return false;
  }
}


const bookServicingState = { step: "form", selectedType: "general" };

// Subscription checkout is fully separate from the main product cart/checkout —
// selecting a servicing package never touches CART_KEY, and buying purifier
// parts never touches this. The two are kept isolated on purpose.
const subscriptionCheckoutState = {
  step: "address", // "address" | "payment" | "confirmation"
  package: null,
  address: null,
  paymentMethod: "upi",
  autoRenewEnabled: false,
  autoRenewUpiId: "",
  lastSubscriptionOrder: null,
};

function setServiceType(typeId) {
  bookServicingState.selectedType = typeId;
  renderBookServicing();
}

function submitServiceBooking() {
  const fields = ["fullName", "phone", "address", "city", "stateName", "pincode", "preferredDate"];
  const values = { serviceType: bookServicingState.selectedType };
  let hasError = false;
  fields.forEach((f) => {
    const el = document.getElementById("svc_" + f);
    const val = el ? el.value.trim() : "";
    values[f] = val;
    if (!val) {
      hasError = true;
      if (el) el.style.borderColor = "#C4501F";
    } else if (el) {
      el.style.borderColor = "#D8DCE1";
    }
  });
  const notesEl = document.getElementById("svc_notes");
  values.notes = notesEl ? notesEl.value.trim() : "";

  if (hasError) {
    const errEl = document.getElementById("serviceFormError");
    if (errEl) errEl.style.display = "block";
    return;
  }

  const booking = {
    id: "SVC" + Date.now().toString().slice(-8),
    bookedAt: new Date().toISOString(),
    status: "Requested",
    ...values,
  };
  saveServiceBooking(booking);
  bookServicingState.step = "confirmation";
  bookServicingState.lastBooking = booking;
  renderBookServicing();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function startAnotherServiceBooking() {
  bookServicingState.step = "form";
  bookServicingState.selectedType = "general";
  renderBookServicing();
}

const packageSubscribedFlags = {};

function subscribeToPackage(pkgId) {
  const pkg = SERVICE_PACKAGES.find((p) => p.id === pkgId);
  if (!pkg) return;
  subscriptionCheckoutState.package = pkg;
  subscriptionCheckoutState.step = "address";
  subscriptionCheckoutState.address = state.deliveryAddress || loadDeliveryAddress() || null;
  state.view = "subscriptionCheckout";
  switchView();
  renderNav();
  renderSubscriptionCheckout();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderBookServicing() {
  const container = document.getElementById("bookServicingView");

  if (bookServicingState.step === "confirmation") {
    const b = bookServicingState.lastBooking;
    const typeInfo = SERVICE_TYPES.find((t) => t.id === b.serviceType);
    container.innerHTML = `
      <div class="order-confirm-wrap">
        <div class="order-confirm-tick">✓</div>
        <h2 class="my-builds-title" style="text-align:center;">Servicing requested!</h2>
        <p class="my-builds-sub" style="text-align:center;">Booking ID: ${esc(b.id)}</p>
        <div class="checkout-card">
          <p class="modal-section-label">Service type</p>
          <p class="order-confirm-address">${esc(typeInfo ? typeInfo.label : b.serviceType)}</p>
          <p class="modal-section-label" style="margin-top:14px;">Preferred date</p>
          <p class="order-confirm-address">${esc(b.preferredDate)}</p>
          <p class="modal-section-label" style="margin-top:14px;">Address</p>

const SUBSCRIPTION_HISTORY_KEY_BROWSER = "ro_configurator_subscription_history_browser";

function subscriptionHistoryKey() {
  if (state.googleUser) return "ro_configurator_subscription_history_google_" + state.googleUser.email.toLowerCase();
  return SUBSCRIPTION_HISTORY_KEY_BROWSER;
}

function loadSubscriptionHistory() {
  try {
    const raw = localStorage.getItem(subscriptionHistoryKey());
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveSubscriptionToHistory(sub) {
  try {
    const history = loadSubscriptionHistory();
    history.unshift(sub);
    localStorage.setItem(subscriptionHistoryKey(), JSON.stringify(history));
  } catch (e) { /* ignore */ }
}

function subCheckoutGoToStep(step) {
  subscriptionCheckoutState.step = step;
  renderSubscriptionCheckout();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function subCheckoutProceedToPayment() {
  const fields = ["fullName", "phone", "line1", "city", "stateName", "pincode"];
  const values = {};
  let hasError = false;
  fields.forEach((f) => {
    const el = document.getElementById("subAddr_" + f);
    const val = el ? el.value.trim() : "";
    values[f] = val;
    if (!val) {
      hasError = true;
      if (el) el.style.borderColor = "#C4501F";
    } else if (el) {
      el.style.borderColor = "#D8DCE1";
    }
  });
  const line2El = document.getElementById("subAddr_line2");
  values.line2 = line2El ? line2El.value.trim() : "";

  if (hasError) {
    const errEl = document.getElementById("subAddressFormError");
    if (errEl) errEl.style.display = "block";
    return;
  }

  subscriptionCheckoutState.address = values;
  subCheckoutGoToStep("payment");
}

function subCheckoutBackToAddress() {
  subCheckoutGoToStep("address");
}

function subCheckoutSetPaymentMethod(method) {
  subscriptionCheckoutState.paymentMethod = method;
  renderSubscriptionCheckout();
}

function subCheckoutToggleAutoRenew() {
  subscriptionCheckoutState.autoRenewEnabled = !subscriptionCheckoutState.autoRenewEnabled;
  renderSubscriptionCheckout();
}

function subCheckoutConfirmSubscription() {
  if (subscriptionCheckoutState.autoRenewEnabled) {
    const upiEl = document.getElementById("subAutoRenewUpiId");
    const upiVal = upiEl ? upiEl.value.trim() : subscriptionCheckoutState.autoRenewUpiId;
    if (!upiVal) {
      if (upiEl) upiEl.style.borderColor = "#C4501F";
      return;
    }
    subscriptionCheckoutState.autoRenewUpiId = upiVal;
  }

  const pkg = subscriptionCheckoutState.package;
  const sub = {
    id: "SUB" + Date.now().toString().slice(-8),
    subscribedAt: new Date().toISOString(),
    packageId: pkg.id,
    packageName: pkg.name,
    price: pkg.price,
    period: pkg.period,
    services: pkg.services,
    address: subscriptionCheckoutState.address,
    paymentMethod: subscriptionCheckoutState.paymentMethod,
    autoRenew: subscriptionCheckoutState.autoRenewEnabled
      ? { enabled: true, upiId: subscriptionCheckoutState.autoRenewUpiId }
      : { enabled: false, upiId: null },
    status: "Active",
  };
  saveSubscriptionToHistory(sub);
  subscriptionCheckoutState.lastSubscriptionOrder = sub;
  subscriptionCheckoutState.step = "confirmation";
  renderSubscriptionCheckout();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function subCheckoutStartOver() {
  subscriptionCheckoutState.step = "address";
  subscriptionCheckoutState.package = null;
  subscriptionCheckoutState.autoRenewEnabled = false;
  subscriptionCheckoutState.autoRenewUpiId = "";
  navLinkClick("Book Servicing");
}

const CONTACT_FAQS = [
  { q: "How long does delivery take?", a: "Ready-made purifiers and parts typically arrive within 3–5 business days. Custom builds may take a little longer depending on part availability." },
  { q: "Can I cancel an order after placing it?", a: "Yes — go to Order History or Book Servicing, select the order or booking, and choose \"Cancel\". You'll be asked to pick a reason." },
  { q: "Do you offer installation?", a: "Yes, installation can be requested from the Book Servicing page under \"New Installation\"." },
  { q: "What if a part is incompatible with my existing purifier?", a: "Each part page has an \"i\" info button explaining what it does and how it fits — check this before ordering, or contact support for guidance." },
];

let contactFaqOpenIndex = null;

function toggleContactFaq(idx) {
  contactFaqOpenIndex = contactFaqOpenIndex === idx ? null : idx;
  renderContact();
}

function submitContactForm() {
  const fields = ["name", "email", "message"];
  let hasError = false;
  fields.forEach((f) => {
    const el = document.getElementById("contact_" + f);
    const val = el ? el.value.trim() : "";
    if (!val) {
      hasError = true;
      if (el) el.style.borderColor = "#C4501F";
    } else if (el) {
      el.style.borderColor = "#D8DCE1";
    }
  });
  const errEl = document.getElementById("contactFormError");
  const successEl = document.getElementById("contactFormSuccess");
  if (hasError) {
    if (errEl) errEl.style.display = "block";
    if (successEl) successEl.style.display = "none";
    return;
  }
  if (errEl) errEl.style.display = "none";
  if (successEl) successEl.style.display = "block";
  ["name", "email", "message"].forEach((f) => {
    const el = document.getElementById("contact_" + f);
    if (el) el.value = "";
  });
}

function renderContact() {
  const container = document.getElementById("contactView");

  const faqHtml = CONTACT_FAQS.map((item, idx) => `
    <div class="faq-item">
      <button class="faq-question" onclick="toggleContactFaq(${idx})">
        <span>${esc(item.q)}</span>
        <span class="faq-chevron">${contactFaqOpenIndex === idx ? "–" : "+"}</span>
      </button>
      ${contactFaqOpenIndex === idx ? `<p class="faq-answer">${esc(item.a)}</p>` : ""}
    </div>
  `).join("");

  container.innerHTML = `
    <div class="my-builds-header">
      <h2 class="my-builds-title">Contact / Support</h2>
      <p class="my-builds-sub">We're happy to help with orders, servicing, or general questions.</p>
    </div>

    <div class="checkout-card contact-info-grid">
      <div class="contact-info-item">
        <p class="modal-section-label">Customer Support</p>
        <p class="about-paragraph">📞 1800-123-4567 (toll-free)<br/>Mon–Sat, 9 AM – 7 PM IST</p>
      </div>
      <div class="contact-info-item">
        <p class="modal-section-label">Email</p>
        <p class="about-paragraph">✉️ support@aquaclear.example<br/>Replies within 24 hours</p>
      </div>
      <div class="contact-info-item">
        <p class="modal-section-label">WhatsApp</p>
        <p class="about-paragraph">💬 +91 98765 43210<br/>For quick questions & order updates</p>
      </div>
      <div class="contact-info-item">
        <p class="modal-section-label">Head Office</p>
        <p class="about-paragraph">📍 4th Floor, Tech Park One,<br/>Yerwada, Pune, Maharashtra 411006</p>
      </div>
    </div>

    <div class="checkout-card">
      <p class="modal-section-label">Frequently Asked Questions</p>
      <div class="faq-list">${faqHtml}</div>
    </div>

    <div class="checkout-card">
      <p class="modal-section-label">Send us a message</p>
      <p id="contactFormError" class="address-form-error" style="display:none;">Please fill in all fields.</p>
      <p id="contactFormSuccess" class="contact-form-success" style="display:none;">Thanks! Your message has been noted (demo only — no email is actually sent).</p>
      <div class="address-form">
        <label class="mock-signin-label">Your name*</label>
        <input type="text" id="contact_name" class="mock-signin-input" placeholder="e.g. Priya Sharma" />

        <label class="mock-signin-label">Email*</label>
        <input type="email" id="contact_email" class="mock-signin-input" placeholder="e.g. priya@example.com" />

        <label class="mock-signin-label">Message*</label>
        <input type="text" id="contact_message" class="mock-signin-input" placeholder="How can we help?" />
      </div>
      <button class="mock-signin-submit" onclick="submitContactForm()">Send Message</button>
    </div>

    <p class="my-builds-sub" style="text-align:center;">This is a demo contact form — messages are not actually sent anywhere.</p>
  `;
}
